<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privat Virtual Chat</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        *, *::before, *::after {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Принудительно исправляем формы (инпуты и кнопки по умолчанию игнорируют глобальный шрифт) */
        input, button, textarea, select {
        font-family: inherit;
        }
        /* Базовые настройки страницы */
        html, body { height: 100dvh; margin: 0; padding: 0; background: #0e1621; overflow: hidden; }
        body { font-family: Segoe UI; color: #f0f0f0; display: flex; justify-content: center; align-items: center; }
        .msg span {
            font-family: Segoe UI; 
            font-size: 1rem; 
            letter-spacing: 0.05px; 
        }
        .container { 
            width: 100%; 
            max-width: 800px; 
            height: 90dvh; 
            background: #0e1621; 
            padding: 15px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            border-radius: 8px;
            border: 1px solid #19395e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        
        /* Жесткое управление видимостью экранов */
        #login-screen, #chat-screen { display: none; width: 100%; box-sizing: border-box; }
        
        #login-screen { padding-top: 15dvh; flex-direction: column; }
        
        /* Экран чата работает как флекс-контейнер во всю высоту родителя */
        #chat-screen { 
            flex-direction: column; 
            height: 100%; 
        }
        
        /* Класс .active переключает дисплей без !important конфликтов */
        #login-screen.active { display: flex; }
        #chat-screen.active { display: flex; }
        
        /* Элементы ввода */
        input, select, button { 
            outline: none; 
            background: #182533; 
            color: #f0f0f0; 
            border: 1px solid transparent !important; 
            padding: 12px; 
            margin: 8px 0; 
            width: 100%; 
            box-sizing: border-box; 
            font-family: Segoe UI;   
            font-size: 0.93rem;
            line-height: 1.5;
            letter-spacing: 0.01px;
            font-weight: 100;
            text-align: center;
            
            border-radius: 8px; }
        input:focus, select:focus {
            outline: none; /* Полностью убирает стандартную рамку браузера */
            background: #202b36;
            border: 1px solid #3a7ecc !important; /* Ставит твою фирменную синюю рамку вместо белой */
            box-shadow: 0 0 8px rgba(58, 126, 204, 0.4); /* Добавляет мягкое синее неоновое свечение */
            caret-color: #f0f0f0;
            font-family: Segoe UI;
            font-size: 0.93rem;
            line-height: 1.5;
            letter-spacing: 0.01px;
            font-weight: 100;
            text-align: center;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #f0f0f0 !important; /* Возвращает твой мягкий белый цвет текста */
            transition: background-color 5000s ease-in-out 0s; /* Магический костыль, который блокирует замену фона браузером */
            box-shadow: inset 0 0 0px 1000px #202b36 !important; /* Заливает поле твоим темным цветом #323339 изнутри */
            caret-color: #f0f0f0 !important;
            font-family: Segoe UI !important;
            font-size: 1rem !important;          /* Размер как у обычного инпута */
            font-weight: normal !important;      /* Если обычный текст не жирный, ставь normal. Если жирный — ставь bold */
            letter-spacing: 0.3px !important; 
        }
        button:hover { background: #3a7ecc; color: #182533; cursor: pointer;}
        .controls input,
        .controls input:focus {
            text-align: left !important;
            padding-left: 16px; /* Небольшой отступ, чтобы буквы не прижимались к левому краю */
        }
        
        /* Шапка с вкладками комнат */
        .chat-header { 
            border-bottom: 1px solid #3a7ecc;
            padding-bottom: 4px; margin-bottom: 10px;
            flex-shrink: 0; 

            display: flex;
            justify-content: space-between; /* Никнейм слева, кнопки строго справа */
            align-items: center;
            padding: 10px 14px;
            background: #182533; /* Ваш цвет фона */
            border-bottom: 1px solid #202b36;

        }
        .room-tabs { display: flex; gap: 6px;}
        .tab-btn {
            width: 28px !important;  /* Жесткая ширина */
            height: 28px !important; /* Жесткая высота */
            padding: 0 !important;   /* Сбрасываем внутренние отступы */
            margin: 0 !important;    /* Сбрасываем внешние отступы */
            border-radius: 50% !important; /* Делаем их круглыми (или 4px для квадратов) */
            font-size: 0.85rem !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #22364d; /* Цвет неактивной вкладки */
            color: #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        /* Стиль для активной или зажатой комнаты */
        .tab-btn.active, .tab-btn:hover {
            background: #3a7ecc !important; /* Ваш фирменный синий */
            color: #ffffff;
        }
        
        /* ОКНО СООБЩЕНИЙ: строго забирает ВСЁ свободное место */
        #chat-window { 
            flex-grow: 1; 
            border: 1px solid transparent;
            overflow-y: auto; 
            padding: 0px; 
            background: transparent;
            margin-bottom: 4px; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
            border-radius: 0px; 
        }
        
        /* Обводка каждого отдельного сообщения */
        .msg { 
            margin-bottom: 8px; 
            line-height: 1.4; 
            word-break: break-all; 
            font-size: 0.93rem; 
            padding: 8px 12px; 
            background: #182533; 
            border: 1px solid transparent;
            border-radius: 8px; 
            flex-shrink: 0;
            color: #f0f0f0;

            font-family: Segoe UI;
            font-size: 0.93rem;
            line-height: 1.5;
            letter-spacing: 0.01px;
            font-weight: 100;
            
            width: fit-content;       /* Плашка сжимается строго по длине текста */
            max-width: 90%;           /* Чтобы длинное сообщение не упиралось в край экрана */
            align-self: flex-start; 
        }
        .msg.my-msg {
            border-color: transparent;
            background: #22364d; /* Слегка синеватый фон */
        }
        
        .time { color: #a7a7a7; font-size: 0.75rem; margin-left: 8px; float: right; line-height: 1.5rem; }
        .system { color: #b3b3b3; font-style: italic; border: none; background: transparent; }
        
        /* Кнопочки удаления и редактирования внутри рамки */
        .msg-actions { float: right; margin-left: 10px; font-size: 1rem; line-height: 1.5rem; }
        .action-lnk { color: #808080; margin-left: 5px; cursor: pointer; text-decoration: none; }
        .action-lnk:hover { color: #ff3333; font-weight: bold; }
        .action-lnk.edit-lnk:hover { color: #ccbd3a; }

        /* Нижняя панель управления */
        .controls { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-shrink: 0; }
        .controls input { margin: 0; padding: 12px; flex-grow: 1; border-radius: 8px; }
        
        /* Квадратная кнопка отправки */
        .send-btn { width: 50px; height: 46px; min-width: 50px; margin: 0; padding: 0; font-size: 1.1rem; background: #3a7ecc; border-width: 2px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        
        /* Сервисная кнопка внизу */
        .footer-controls { display: flex; justify-content: flex-start; margin-top: 5px; margin-bottom: 5px; flex-shrink: 0; }
        .clear-btn { width: auto; margin: 0; padding: 4px 8px; font-size: 0.75rem; border-color: #550000; color: #ff3333; background: transparent; border-radius: 8px; }
        .clear-btn:hover { background: #ff3333; color: #182533; border-color: #ff3333; }
        html {
        scrollbar-color: #22364d #182533; 
        scrollbar-width: auto; 
    
        }
        .msg a {
            color: #77b0ed !important; 
            text-decoration: none !important;;
        }

        .msg a:hover {
            color: #77b0ed !important; 
            text-decoration: underline !important;;
        }
        /* УМНЫЙ МЕДИА-ЗАПРОС ДЛЯ СМАРТФОНОВ */
        @media (max-width: 768px) {
            body { padding: 0; align-items: stretch; }
            .container { 
                height: 100dvh; 
                border: none; 
                border-radius: 0; 
                box-shadow: none; 
            }
            #login-screen { padding-top: 20dvh; padding-left: 15px; padding-right: 15px; }
        }
        .chat-header button.header-clear-btn {
            width: auto !important;
            max-width: max-content !important;
            flex-grow: 0 !important;
            margin: 0 !important;
            padding: 2px 8px !important;
            font-size: 0.8rem !important;
            background: transparent !important;
            color: #a0a0a0 !important;
            border: none !important;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s, color 0.2s;
        }

        /* 2. Эффект наведения для кнопки очистки */
        .chat-header button.header-clear-btn:hover {
            opacity: 1;
            color: #ff5555 !important;
            background: transparent !important;
        }

        /* 4. Запрещаем никнейму переноситься в две строки */
        #user-info {
            white-space: nowrap !important;
            flex-shrink: 0 !important;
        }
        .chat-header {
            padding: 2px 10px !important;    /* Минимальные отступы сверху и снизу (всего 2px) */
            min-height: 16px !important;    /* Уменьшаем минимальную высоту до предела */
            height: 18px !important;        /* Жестко фиксируем супер-тонкий размер */
        }

        /* Уменьшаем круглые кнопки комнат под стать тонкой шапке */
        .chat-header .room-tabs {
            gap: 12px !important;            /* Сближаем кнопочки плотнее */
        }

        .chat-header .tab-btn {
            width: 20px !important;         /* Были 24px, делаем супер-компактные 20px */
            height: 20px !important;
            font-size: 0.75rem !important;  /* Чуть-чуть уменьшаем цифры внутри */
        }

        /* Прижимаем никнейм и кнопку очистки к базовой линии, чтобы всё было идеально ровно */
        #user-info, 
        .chat-header button.header-clear-btn {
            line-height: 1 !important;      /* Убираем скрытые межстрочные интервалы */
            font-size: 0.85rem !important;  /* Делаем шрифт капельку компактнее */
        }
        .chat-header {
            background: transparent !important; /* Убираем серый фон, шапка сливается с общей подложкой */
            border-bottom: 1px solid #3a7ecc !important; /* Тонкая синяя полосочка внизу (ваш фирменный цвет) */
        }

    </style>
</head>
<body>

<div class="container">
    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen" class="active">
        <h2 style="font-family: Segoe UI; text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;">Privat Virtual Chat</h2>
        <input type="text" id="username" placeholder="Ваше имя / Ник" maxlength="15">
        <input type="password" id="password" placeholder="Пароль" maxlength="20" onkeypress="handleLoginKeyPress(event)">
        <button onclick="joinChat()">Подключиться</button>
    </div>

    <!-- ЭКРАН ЧАТА -->
    <div id="chat-screen">
        <div class="chat-header">
            <!-- Слева: Никнейм -->
            <div style="font-family: Segoe UI; font-size: 0.93rem;" id="user-info">Вы: -</div>
            
            <!-- По центру: Компактная кнопка очистки экрана -->
            <button class="header-clear-btn" onclick="clearChat()" title="Очистить экран">🗑️ Очистить</button>
            
            <!-- Справа: Кнопки комнат -->
            <div class="room-tabs">
                <button class="tab-btn" id="tab-general" onclick="switchRoom('general')">1</button>
                <button class="tab-btn" id="tab-emergency" onclick="switchRoom('emergency')">2</button>
                <button class="tab-btn" id="tab-secret" onclick="switchRoom('secret')">3</button>
            </div>
        </div>
        
        <div id="chat-window"></div>
        
        <div class="controls">
            <input type="text" id="message-input" placeholder="Писать тут..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" id="send-button" onclick="sendMessage()">➔</button>
        </div>             
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
