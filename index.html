<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Chat Room</title>
    <style>
        body { font-family: monospace; background: #242424; color: #3a7ecc; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; background: #111; padding: 15px; border: 2px solid #3a7ecc; border-radius: 5px; box-shadow: 0 0 15px rgba(136, 198, 255, 0.2); box-sizing: border-box; }
        #login-screen, #chat-screen { display: none; }
        .active { display: block !important; }
        
        /* Элементы ввода */
        input, select, button { background: #1a1a1a; color: #3a7ecc; border: 1px solid #3a7ecc; padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; font-family: monospace; font-size: 1rem; }
        button:hover { background: #3a7ecc; color: #242424; cursor: pointer; font-weight: bold; }
        
        /* Шапка с вкладками комнат */
        .chat-header { border-bottom: 1px solid #3a7ecc; padding-bottom: 10px; margin-bottom: 10px; }
        .room-tabs { display: flex; gap: 5px; overflow-x: auto; margin-top: 5px; padding-bottom: 5px; }
        .tab-btn { width: auto; flex-grow: 1; padding: 6px 12px; margin: 0; font-size: 0.85rem; white-space: nowrap; background: #1a1a1a; border-color: #19395e; color: #4a8bd4; }
        .tab-btn.active-tab { background: #3a7ecc; color: #242424; border-color: #3a7ecc; font-weight: bold; }
        
        /* Окно сообщений */
        #chat-window { height: 50vh; min-height: 200px; border: 1px solid #3a7ecc; overflow-y: auto; padding: 10px; background: #222222; margin-bottom: 10px; display: flex; flex-direction: column; box-sizing: border-box; }
        .msg { margin-bottom: 10px; line-height: 1.4; word-break: break-all; font-size: 1.05rem; }
        .time { color: #535353; font-size: 0.75rem; margin-left: 8px; }
        .system { color: #ffaa00; font-style: italic; }
        
        /* Нижняя панель управления: теперь поле ввода и кнопка идут в один ряд */
        .controls { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
        .controls input { margin: 0; padding: 12px; flex-grow: 1; }
        
        /* Квадратная кнопка отправки */
        .send-btn { width: 50px; height: 46px; min-width: 50px; margin: 0; padding: 0; font-size: 1.1rem; background: #224b7a; border-width: 2px; display: flex; align-items: center; justify-content: center; }
        
        /* Маленькая сервисная строчка в самом низу, выровненная по левому краю */
        .footer-controls { display: flex; justify-content: flex-start; margin-top: 15px; }
        .clear-btn { width: auto; margin: 0; padding: 4px 8px; font-size: 0.75rem; border-color: #550000; color: #ff3333; background: transparent; }
        .clear-btn:hover { background: #ff3333; color: #242424; border-color: #ff3333; }
    </style>
</head>
<body>

<div class="container">
    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen" class="active">
        <h2 style="text-align: center; text-transform: uppercase; letter-spacing: 2px;">Введите Ник</h2>
        <input type="text" id="username" placeholder="Ваше имя / Ник" maxlength="15">
        <button onclick="joinChat()">Подключиться</button>
    </div>

    <!-- ЭКРАН ЧАТА -->
    <div id="chat-screen">
        <div class="chat-header">
            <div style="font-size: 0.9rem;" id="user-info">Вы: -</div>
            <!-- Вкладки комнат -->
            <div class="room-tabs">
                <button class="tab-btn" id="tab-general" onclick="switchRoom('general')">1</button>
                <button class="tab-btn" id="tab-emergency" onclick="switchRoom('emergency')">2</button>
                <button class="tab-btn" id="tab-secret" onclick="switchRoom('secret')">3</button>
            </div>
        </div>
        
        <div id="chat-window"></div>
        
        <div class="controls">
            <input type="text" id="message-input" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
            <!-- Вместо длинного слова используем стрелочку или символ отправки, чтобы кнопка оставалась аккуратным квадратом -->
            <button class="send-btn" onclick="sendMessage()">➔</button>
        </div>
        
        <div class="footer-controls">
            <button class="clear-btn" onclick="clearChat()">Очистить экран</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
