<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privat Virtual Chat</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        /* Базовые настройки страницы */
        html, body { height: 100dvh; margin: 0; padding: 0; background: #0e1621; overflow: hidden; }
        body { font-family: Segoe UI; color: #f0f0f0; display: flex; justify-content: center; align-items: center; }
        .msg span[style*="font-weight: bold"] {
            font-family: Segoe UI; /* Можно задать отдельный ретро-шрифт */
            font-size: 1rem; /* Сделать ник чуть крупнее самого текста сообщения */
            letter-spacing: 0.05px; /* Слегка раздвинуть буквы в имени */
        }
        .container { 
            width: 100%; 
            max-width: 800px; 
            height: 90dvh; 
            background: #0e1621; 
            padding: 15px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            border-radius: 6px;
            border: 1px solid #19395e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        
        /* Жесткое управление видимостью экранов */
        #login-screen, #chat-screen { display: none; width: 100%; box-sizing: border-box; }
        
        #login-screen { padding-top: 15dvh; flex-direction: column; }
        
        /* Экран чата работает как флекс-контейнер во всю высоту родителя */
        #chat-screen { 
            flex-direction: column; 
            height: 100%; 
        }
        
        /* Класс .active переключает дисплей без !important конфликтов */
        #login-screen.active { display: flex; }
        #chat-screen.active { display: flex; }
        
        /* Элементы ввода */
        input, select, button { background: #182533; color: #f0f0f0; border: 1px solid transparent; padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; font-family: monospace; font-size: 1rem; border-radius: 6px; }
        input:focus, select:focus {
            outline: none; /* Полностью убирает стандартную рамку браузера */
            background: #202b36;
            border-color: #3a7ecc; /* Ставит твою фирменную синюю рамку вместо белой */
            box-shadow: 0 0 8px rgba(58, 126, 204, 0.4); /* Добавляет мягкое синее неоновое свечение */
            caret-color: #f0f0f0;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus {
            -webkit-text-fill-color: #f0f0f0 !important; /* Возвращает твой мягкий белый цвет текста */
            transition: background-color 5000s ease-in-out 0s; /* Магический костыль, который блокирует замену фона браузером */
            box-shadow: inset 0 0 0px 1000px #202b36 !important; /* Заливает поле твоим темным цветом #323339 изнутри */
        }
        button:hover { background: #3a7ecc; color: #182533; cursor: pointer; font-weight: bold; }
        
        /* Шапка с вкладками комнат */
        .chat-header { border-bottom: 1px solid #3a7ecc; padding-bottom: 10px; margin-bottom: 10px; flex-shrink: 0; }
        .room-tabs { display: flex; gap: 5px; overflow-x: auto; margin-top: 5px; padding-bottom: 5px; }
        .tab-btn { width: auto; flex-grow: 1; padding: 6px 12px; margin: 0; font-size: 0.85rem; white-space: nowrap; background: #182533; border-color: #19395e; color: #4a8bd4; border-radius: 4px; }
        .tab-btn.active-tab { background: #3a7ecc; color: #182533; border-color: #3a7ecc; font-weight: bold; }
        
        /* ОКНО СООБЩЕНИЙ: строго забирает ВСЁ свободное место */
        #chat-window { 
            flex-grow: 1; 
            border: 1px solid transparent;
            overflow-y: auto; 
            padding: 4px; 
            background: transparent;
            margin-bottom: 6px; 
            display: flex; 
            flex-direction: column; 
            box-sizing: border-box; 
            border-radius: 0px; 
        }
        
        /* Обводка каждого отдельного сообщения */
        .msg { 
            margin-bottom: 8px; 
            line-height: 1.4; 
            word-break: break-all; 
            font-size: 1.05rem; 
            padding: 8px 12px; 
            background: #182533; 
            border: 1px solid transparent;
            border-radius: 6px; 
            flex-shrink: 0;
            color: #f0f0f0;

            font-family: Segoe UI;   /* Стиль шрифта (monospace, sans-serif, 'Courier New' и т.д.) */
            font-size: 0.93rem;       /* Размер шрифта (можно увеличивать: 1.1rem, 1.2rem) */
            line-height: 1.5;         /* Межстрочный интервал (1.4 - 1.6 делает текст очень читаемым) */
            letter-spacing: 0.01px;    /* Расстояние между буквами (слегка раздвигает текст) */
            font-weight: 100; 
        }
        .msg.my-msg {
            border-color: transparent;
            background: #22364d; /* Слегка синеватый фон */
        }
        
        .time { color: #a7a7a7; font-size: 0.75rem; margin-left: 8px; float: right; line-height: 1.5rem; }
        .system { color: #b3b3b3; font-style: italic; border: none; background: transparent; }
        
        /* Кнопочки удаления и редактирования внутри рамки */
        .msg-actions { float: right; margin-left: 10px; font-size: 0.8rem; line-height: 1.5rem; }
        .action-lnk { color: #808080; margin-left: 5px; cursor: pointer; text-decoration: none; }
        .action-lnk:hover { color: #ff3333; font-weight: bold; }
        .action-lnk.edit-lnk:hover { color: #3a7ecc; }

        /* Нижняя панель управления */
        .controls { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-shrink: 0; }
        .controls input { margin: 0; padding: 12px; flex-grow: 1; border-radius: 4px; }
        
        /* Квадратная кнопка отправки */
        .send-btn { width: 50px; height: 46px; min-width: 50px; margin: 0; padding: 0; font-size: 1.1rem; background: #3a7ecc; border-width: 2px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        
        /* Сервисная кнопка внизу */
        .footer-controls { display: flex; justify-content: flex-start; margin-top: 5px; margin-bottom: 5px; flex-shrink: 0; }
        .clear-btn { width: auto; margin: 0; padding: 4px 8px; font-size: 0.75rem; border-color: #550000; color: #ff3333; background: transparent; border-radius: 4px; }
        .clear-btn:hover { background: #ff3333; color: #182533; border-color: #ff3333; }

        .msg a {
            color: #77b0ed !important; 
            text-decoration: none !important;;
        }

        /* Эффект при наведении мышки на ссылку (для ПК версии) */
        .msg a:hover {
            color: #77b0ed !important; 
            text-decoration: underline !important;;
        }
        /* УМНЫЙ МЕДИА-ЗАПРОС ДЛЯ СМАРТФОНОВ */
        @media (max-width: 768px) {
            body { padding: 0; align-items: stretch; }
            .container { 
                height: 100dvh; 
                border: none; 
                border-radius: 0; 
                box-shadow: none; 
            }
            #login-screen { padding-top: 20dvh; padding-left: 15px; padding-right: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen" class="active">
        <h2 style="text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;">Privat Virtual Chat</h2>
        <input type="text" id="username" placeholder="Ваше имя / Ник" maxlength="15">
        <input type="password" id="password" placeholder="Пароль" maxlength="20" onkeypress="handleLoginKeyPress(event)">
        <button onclick="joinChat()">Подключиться</button>
    </div>

    <!-- ЭКРАН ЧАТА -->
    <div id="chat-screen">
        <div class="chat-header">
            <div style="font-size: 0.9rem;" id="user-info">Вы: -</div>
            <div class="room-tabs">
                <button class="tab-btn" id="tab-general" onclick="switchRoom('general')">1</button>
                <button class="tab-btn" id="tab-emergency" onclick="switchRoom('emergency')">2</button>
                <button class="tab-btn" id="tab-secret" onclick="switchRoom('secret')">3</button>
            </div>
        </div>
        
        <div id="chat-window"></div>
        
        <div class="controls">
            <input type="text" id="message-input" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" id="send-button" onclick="sendMessage()">➔</button>
        </div>
        
        <div class="footer-controls">
            <button class="clear-btn" onclick="clearChat()">Очистить экран</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
