<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Chat Room</title>
    <style>
        html, body { height: 100dvh; margin: 0; padding: 0; background: #242424; overflow: hidden; }
        body { font-family: monospace; color: #3a7ecc; display: flex; justify-content: center; align-items: center; }
        
        .container { width: 100%; max-width: 800px; height: 90dvh; background: #111; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 6px; border: 1px solid #19395e; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); }
        #login-screen, #chat-screen { display: none; width: 100%; box-sizing: border-box; }
        #login-screen { padding-top: 15dvh; flex-direction: column; }
        #chat-screen { flex-direction: column; height: 100%; }
        #login-screen.active { display: flex; }
        #chat-screen.active { display: flex; }
        
        input, select, button { background: #1a1a1a; color: #3a7ecc; border: 1px solid #3a7ecc; padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; font-family: monospace; font-size: 1rem; border-radius: 4px; }
        button:hover { background: #3a7ecc; color: #242424; cursor: pointer; font-weight: bold; }
        
        .chat-header { border-bottom: 1px solid #3a7ecc; padding-bottom: 10px; margin-bottom: 10px; flex-shrink: 0; }
        .room-tabs { display: flex; gap: 5px; overflow-x: auto; margin-top: 5px; padding-bottom: 5px; }
        .tab-btn { width: auto; flex-grow: 1; padding: 6px 12px; margin: 0; font-size: 0.85rem; white-space: nowrap; background: #1a1a1a; border-color: #19395e; color: #4a8bd4; border-radius: 4px; }
        .tab-btn.active-tab { background: #3a7ecc; color: #242424; border-color: #3a7ecc; font-weight: bold; }
        
        #chat-window { flex-grow: 1; border: 1px solid #3a7ecc; overflow-y: auto; padding: 10px; background: #161616; margin-bottom: 10px; display: flex; flex-direction: column; box-sizing: border-box; border-radius: 4px; }
        
        /* Базовое сообщение (Чужое) */
        .msg { margin-bottom: 8px; line-height: 1.4; word-break: break-all; font-size: 1.05rem; padding: 8px 12px; background: #202020; border: 1px solid #2a2a2a; border-radius: 4px; flex-shrink: 0; position: relative; }
        
        /* СВОЕ СООБЩЕНИЕ (Другой цвет рамки и фона) */
        .msg.my-msg { border-color: #3a7ecc; background: #152233; }
        
        .time { color: #535353; font-size: 0.75rem; margin-left: 8px; float: right; line-height: 1.5rem; }
        .system { color: #ffaa00; font-style: italic; border: none; background: transparent; }
        
        /* Кнопочки удаления и редактирования внутри рамки */
        .msg-actions { float: right; margin-left: 10px; font-size: 0.8rem; line-height: 1.5rem; }
        .action-lnk { color: #535353; margin-left: 5px; cursor: pointer; text-decoration: none; }
        .action-lnk:hover { color: #ff3333; font-weight: bold; }
        .action-lnk.edit-lnk:hover { color: #3a7ecc; }
        
        .controls { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-shrink: 0; }
        .controls input { margin: 0; padding: 12px; flex-grow: 1; border-radius: 4px; }
        
        .send-btn { width: 50px; height: 46px; min-width: 50px; margin: 0; padding: 0; font-size: 1.1rem; background: #224b7a; border-width: 2px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        
        .footer-controls { display: flex; justify-content: flex-start; margin-top: 5px; margin-bottom: 5px; flex-shrink: 0; }
        .clear-btn { width: auto; margin: 0; padding: 4px 8px; font-size: 0.75rem; border-color: #550000; color: #ff3333; background: transparent; border-radius: 4px; }
        .clear-btn:hover { background: #ff3333; color: #242424; border-color: #ff3333; }

        @media (max-width: 768px) {
            body { padding: 0; align-items: stretch; }
            .container { height: 100dvh; border: none; border-radius: 0; box-shadow: none; }
            #login-screen { padding-top: 20dvh; padding-left: 15px; padding-right: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ЭКРАН ВХОДА -->
    <div id="login-screen" class="active">
        <h2 style="text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;">Авторизация</h2>
        <input type="text" id="username" placeholder="Ваше имя / Ник" maxlength="15">
        <input type="password" id="password" placeholder="Секретный пароль" maxlength="20" onkeypress="handleLoginKeyPress(event)">
        <button onclick="joinChat()">Подключиться</button>
    </div>

    <!-- ЭКРАН ЧАТА -->
    <div id="chat-screen">
        <div class="chat-header">
            <div style="font-size: 0.9rem;" id="user-info">Вы: -</div>
            <div class="room-tabs">
                <button class="tab-btn" id="tab-general" onclick="switchRoom('general')">1</button>
                <button class="tab-btn" id="tab-emergency" onclick="switchRoom('emergency')">2</button>
                <button class="tab-btn" id="tab-secret" onclick="switchRoom('secret')">3</button>
            </div>
        </div>
        
        <div id="chat-window"></div>
        
        <div class="controls">
            <input type="text" id="message-input" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
            <button class="send-btn" id="send-button" onclick="sendMessage()">➔</button>
        </div>
        
        <div class="footer-controls">
            <button class="clear-btn" onclick="clearChat()">Очистить экран</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
